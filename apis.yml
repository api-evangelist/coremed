name: coremed
description: CoreMed (Beijing) Biomedical Research Co., Ltd. is a China-based contract research
  organization (CRO) founded in 2013 that provides clinical professional services for innovative
  cardiovascular medical devices and structural-heart products. Its services span animal testing,
  human clinical trials, data management, statistical analysis, and independent core-laboratory
  imaging analysis, and it was among the first domestic providers in China to run trials for
  interventional heart valves, LAA occluders, and bioresorbable scaffolds. Headquartered in Beijing
  with branches in Shanghai, Guangzhou, and Chengdu, CoreMed is backed by Qiming Venture Partners.
  This is a services/CRO company with no public API, developer portal, or machine-readable surface;
  its site (coremed.com.cn) was unreachable at enrichment time (connection refused, expired TLS cert).
